[project]
name = "pyct"
version = "0.3.0"
description = "Concolic testing for Python"
requires-python = ">=3.12"
authors = [
  { name = "dongdong867", email = "dongdong0867@gmail.com" },
]
dependencies = []

[project.scripts]
pyct = "pyct.cli:main"

[dependency-groups]
dev = [
  "coverage>=7.10",
  "import-linter>=2.0",
  "pyrefly>=0.33",
  "pytest>=8.0",
  "pytest-cov>=7.1",
  "pytest-timeout>=2.3",
  "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
project-includes = ["src/**/*", "tests/**/*"]
project-excludes = ["**/.venv/**/*", "**/__pycache__/**/*"]
search-path = ["src", "."]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
# a test still running after 60 seconds ends the run with every thread's stack, so a hang
# fails instead of stalling. The thread method, because pyct's deadline owns SIGALRM
timeout = 60
timeout_method = "thread"

# Measured when pytest runs with --cov. The acceptance tests start pyct in a
# subprocess, and patch = subprocess measures the code it runs there too. fork
# measures a forked child, and _exit saves its data when it ends with os._exit.
[tool.coverage.run]
branch = true
source = ["pyct"]
patch = ["subprocess", "fork", "_exit"]

# fail_under is the branch coverage the suite reached when this floor was set,
# rounded down. Raise it when coverage rises; a drop below it fails the run.
[tool.coverage.report]
fail_under = 98
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
src = ["src", "tests"]
line-length = 100

# C901, PLR0913 and PLR0915 hold the size rules of CLAUDE.md › Conventions.
# tests/line_limits.py holds the two ruff has no rule for: body and file lines.
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C901", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# max-args counts every parameter but self, cls, *args, **kwargs and names starting with _,
# in functions not marked @override or @overload. max-statements counts a docstring as one
[tool.ruff.lint.pylint]
max-args = 5
max-statements = 20

[tool.setuptools.packages.find]
where = ["src"]

[tool.importlinter]
root_package = "pyct"

# The layers of CLAUDE.md, top to bottom. A layer in parentheses has no code
# yet and is optional to import-linter; drop the parentheses when it gets code.
[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
  "pyct.cli",
  "(pyct.sweep)",
  "(pyct.llm)",
  "pyct.run",
  "(pyct.rewrite)",
  "pyct.solver",
  "pyct.branches",
  "pyct.execution",
  "pyct.binding",
  "pyct.results",
  "pyct.core",
  "pyct.config",
  "(pyct.utils)",
]
