[project]
name = "pyct"
version = "0.3.0"
description = "Concolic testing for Python"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "dongdong867", email = "dongdong0867@gmail.com" },
]
dependencies = []

[project.scripts]
pyct = "pyct.cli:entry"

[dependency-groups]
dev = [
  "coverage>=7.10",
  "import-linter>=2.0",
  "pyrefly>=0.33",
  "pytest>=8.0",
  "pytest-cov>=7.1",
  "pytest-timeout>=2.3",
  # tests/serial_last.py overrides xdist's private scheduling; a new release needs checking
  "pytest-xdist>=3.8,<3.9",
  "ruff>=0.12",
]
# The libraries the compare tool's realworld and library sets run, at the versions legacy's
# lock holds, so both sides import the same release. A development group: pyct never needs them
compare-coverage = [
  "phonenumbers==8.13.51",
  "python-dateutil==2.9.0.post0",
  "pyyaml==6.0.3",
  "simplejson==3.19.3",
  "sympy==1.14.0",
  "validators==0.35.0",
  "werkzeug==3.1.3",
]

[tool.uv]
default-groups = ["dev", "compare-coverage"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
project-includes = ["src/**/*", "tests/**/*", "tools/**/*"]
project-excludes = ["**/.venv/**/*", "**/__pycache__/**/*"]
search-path = ["src", "."]

[tool.pytest.ini_options]
# -n N runs the suite in N workers, and loadgroup holds the tests marked serial back until
# every other test is done; tests/serial_last.py. Without -n, or with -n 0, the suite runs in
# one process; -p no:xdist cannot, since --dist is xdist's
addopts = "-v --tb=short --dist loadgroup"
testpaths = ["tests"]
# a test still running after 60 seconds ends the run with every thread's stack, so a hang
# fails instead of stalling; tests/test_timeout.py shows it ends one stuck on coverage's
# lock. The thread method, because pyct's deadline owns SIGALRM
timeout = 60
timeout_method = "thread"
# that thread runs through every test, so each fork a test makes warns that the process
# runs threads; pyct forks only while its process runs one thread, or when a test asks it to
filterwarnings = ['ignore:This process \(pid=\d+\) is multi-threaded:DeprecationWarning']
markers = [
  "legacy: runs legacy's engine from a checkout of main, built once per session; -m 'not legacy' skips it",
  "serial: failed beside a parallel run's other workers; the run holds it back and runs it last, alone",
]

# Measured when pytest runs with --cov: pyct, and the compare tool in tools/. The
# acceptance tests start pyct and the tool in a subprocess, and patch = subprocess
# measures the code they run there too; the tool keeps it out of the sides it runs. fork
# starts measuring in a forked child, whose data is saved only when it exits
# normally. No _exit: it makes os._exit save coverage first, and the timeout's
# os._exit would then wait on the lock a stuck test holds, so a child ending in
# os._exit saves nothing.
[tool.coverage.run]
branch = true
source = ["pyct", "tools"]
patch = ["subprocess", "fork"]

# fail_under is the lowest total of three full runs when this floor was set,
# 98.696%, rounded down to 0.1. Raise it when coverage rises; a total that
# rounds to less fails the run.
[tool.coverage.report]
fail_under = 98.6
precision = 1
show_missing = true
skip_covered = true

[tool.ruff]
src = ["src", "tests", "."]
line-length = 100

# C901, PLR0913 and PLR0915 hold the size rules of CLAUDE.md › Conventions.
# tests/line_limits.py holds the two ruff has no rule for: body and file lines.
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C901", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# max-args counts every parameter but self, cls, *args, **kwargs and dummy names such as _
# and _name, in functions not marked @override or @overload. max-statements counts a
# docstring as one
[tool.ruff.lint.pylint]
max-args = 5
max-statements = 20

[tool.setuptools.packages.find]
where = ["src"]

[tool.importlinter]
root_packages = ["pyct", "tools"]

# The layers of CLAUDE.md, top to bottom. A layer in parentheses has no code
# yet and is optional to import-linter; drop the parentheses when it gets code.
[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
  "pyct.cli",
  "pyct.sweep",
  "(pyct.llm)",
  "pyct.run",
  "(pyct.rewrite)",
  "pyct.intercept",
  "pyct.solver",
  "pyct.branches",
  "pyct.execution",
  "pyct.binding",
  "pyct.results",
  "pyct.core",
  "pyct.config",
  "(pyct.utils)",
]

# core's files, top to bottom: a file imports only its own layer and those below it. Every file
# is listed, so a new one fails lint until it takes a place. It checks imports alone, so a class
# a lower file reaches through a registry, as `numbers.enter` keeps them, is not checked.
[[tool.importlinter.contracts]]
name = "core's layers"
type = "layers"
containers = ["pyct.core"]
exhaustive = true
layers = [
  "bases : bound : codes : conversions : handed : hashed : math_calls : substitutes : type_calls",
  "dict_changes : dict_compares : dict_handouts : dict_reads : dict_state : dict_views : dict_walk_keys : dicts",
  "list_changes : list_compares : list_forms : list_reads : list_state : lists : ranges",
  "str_cases : str_formats : str_joins : str_lengths : str_literals : str_operands : str_positions : str_repeats : str_splits : str_steps : str_walks : strs",
  "bools : floats : ints : numbers : texts",
  "branch : counts : escapes : spans : values : walk_key_escapes",
]

# The compare tool treats v2 as a black box: it runs `pyct run` and reads its lines, so it
# measures what a person runs. Decision compare-tool-outside-pyct-layers
[[tool.importlinter.contracts]]
name = "The compare tool never imports pyct"
type = "forbidden"
source_modules = ["tools"]
forbidden_modules = ["pyct"]
