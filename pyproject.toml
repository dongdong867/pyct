[project]
name = "pyct"
version = "0.3.0"
description = "Concolic testing for Python"
requires-python = ">=3.12"
authors = [
  { name = "dongdong867", email = "dongdong0867@gmail.com" },
]
dependencies = []

[project.scripts]
pyct = "pyct.cli:main"

[dependency-groups]
dev = [
  "import-linter>=2.0",
  "pyrefly>=0.33",
  "pytest>=8.0",
  "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
project-includes = ["src/**/*", "tests/**/*"]
project-excludes = ["**/.venv/**/*", "**/__pycache__/**/*"]
search-path = ["src"]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Until the first slice creates src/pyct there is nothing to build. Remove then.
package = false
