[project]
name = "pyct"
version = "0.2.0"
description = "Python concolic testing with LLM-assisted discovery oracles"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "dongdong867", email = "dongdong0867@gmail.com" },
]
dependencies = [
    "coverage>=7.10.7",
    "func-timeout>=4.3.5",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]
benchmark = [
    "crosshair-tool>=0.0.97",
]
realworld = [
    "werkzeug==3.1.3",
    "phonenumbers==8.13.51",
    "simplejson==3.19.3",
    "python-dateutil==2.9.0.post0",
    "validators>=0.22.0",
]
library = [
    "pyyaml>=6.0",
    "sympy>=1.14.0",
]
all = [
    "pyct[llm,benchmark,realworld,library]",
]

[project.scripts]
pyct = "pyct.cli:main"
pyct-benchmark = "tools.benchmark.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pyct*", "tools*"]
exclude = ["examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "slow: opt-in test excluded from the default suite; run with `pytest -m slow`.",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyrefly]
project-includes = ["src/**/*", "tests/**/*", "tools/**/*"]
project-excludes = ["**/*venv/**/*", "**/__pycache__/**/*"]
search-path = ["src", ".", "tools"]

# Suppressions for concolic type design.
# ConcolicInt(int), ConcolicFloat(float), ConcolicStr(str), ConcolicBool(bool)
# intentionally override built-in operator signatures to intercept operations
# for symbolic expression tracking. These are not bugs.
[tool.pyrefly.errors]
bad-argument-type = false
bad-assignment = false
bad-override = false
bad-return = false
implicit-import = false
missing-attribute = false
no-matching-overload = false
not-iterable = false
unsupported-operation = false

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.5.0",
    "pyrefly>=0.33.1",
    "mutmut>=3.5.0",
    "hypothesis>=6.0.0",
]

[tool.mutmut]
# isolated_runner.py is excluded: its multiprocessing-spawned subprocess tests
# clash with mutmut's coverage instrumentation and fork start-method on macOS.
# Watchdog/checkpoint behavior is validated via Phase 2 comment-out ACs instead.
paths_to_mutate = ["src/pyct/engine/"]
tests_dir = ["tests/unit/engine/"]
also_copy = ["src/pyct/", "tests/unit/engine/_fixtures/"]
do_not_mutate = [
    "**/__init__.py",
    "**/_fixtures/**",
    "**/isolated_runner.py",
]
mutate_only_covered_lines = false
pytest_add_cli_args = [
    "-x",
    "-q",
    "--tb=short",
    "-p", "no:cacheprovider",
    # Subprocess-spawning tests clash with mutmut's fork start-method on macOS.
    "--ignore=tests/unit/engine/test_isolated_runner_partial.py",
    "--deselect=tests/unit/engine/test_seed_inputs_and_plugins.py::TestRunConcolicSeedInputsAndPlugins::test_run_concolic_isolated_with_seed_inputs",
    # sys.settrace conflicts inside mutmut's in-process pytest.main runner
    "--deselect=tests/unit/engine/test_line_tracer.py::TestLineTracerFileFiltering::test_multiple_files_captured_per_file",
]
