[project]
name = "pyct"
version = "0.3.0"
description = "Concolic testing for Python"
requires-python = ">=3.12"
authors = [
  { name = "dongdong867", email = "dongdong0867@gmail.com" },
]
dependencies = []

[project.scripts]
pyct = "pyct.cli:main"

[dependency-groups]
dev = [
  "import-linter>=2.0",
  "pyrefly>=0.33",
  "pytest>=8.0",
  "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
project-includes = ["src/**/*", "tests/**/*"]
project-excludes = ["**/.venv/**/*", "**/__pycache__/**/*"]
search-path = ["src"]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.importlinter]
root_package = "pyct"

# The layers of CLAUDE.md, top to bottom. A layer in parentheses has no code
# yet and is optional to import-linter; drop the parentheses when it gets code.
[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
  "pyct.cli",
  "(pyct.sweep)",
  "(pyct.llm)",
  "pyct.run",
  "(pyct.rewrite)",
  "(pyct.solver)",
  "(pyct.branches)",
  "pyct.execution",
  "(pyct.binding)",
  "pyct.results",
  "pyct.core",
  "(pyct.config)",
  "(pyct.utils)",
]
